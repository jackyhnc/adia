name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true

      - name: Build, sign, notarize, package
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -e
          # Import signing cert if provided
          if [ -n "${MAC_CERT_P12_BASE64:-}" ]; then
            KEYCHAIN=signing.keychain-db
            KEYCHAIN_PASS=$(openssl rand -hex 24)
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            echo "$MAC_CERT_P12_BASE64" | base64 --decode > cert.p12
            security import cert.p12 -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            rm cert.p12
          fi
          chmod +x scripts/*.sh
          scripts/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: adia-dmg
          path: dist/Adia-*.dmg*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Adia-*.dmg
            dist/Adia-*.dmg.sha256
          body: |
            **Adia ${{ steps.ver.outputs.VERSION }}**

            Download the `.dmg`, drag Adia to Applications, and launch.

            macOS 14+, Apple Silicon. Notarized when build secrets are configured.
          generate_release_notes: true
