name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
      - run: swift build -c debug
      - run: swift build -c release

  swift-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
      # `--no-parallel`: many suites share @MainActor singletons (NotchState.shared,
      # SettingsStore.shared, CalloutManager.shared, ...). `.serialized` on a @Suite only
      # serializes *within* that suite — Swift Testing still runs different suites
      # concurrently by default, which races on the shared singleton state and produces
      # flaky cross-suite failures (e.g. NotchStateTests reading a calloutMessage that
      # CalloutManagerTests just wrote). Disabling parallelism entirely is the only way
      # to make these singleton-backed suites deterministic without rewriting them to
      # use injected per-test instances.
      - run: swift test --no-parallel

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: 'web/package-lock.json' }
      - run: npm ci || npm install
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  web-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: 'web/package-lock.json' }
      - run: npm ci || npm install
      - run: npm run test:run

  pipeline-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
      - run: bash scripts/test-pipeline.sh
